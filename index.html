<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperAPK - Mobil Oyun Arşivi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: #1f1f1f;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        header h1 {
            color: #4CAF50;
            font-size: 2rem;
            margin-bottom: 5px;
        }
        header p {
            color: #888;
            font-size: 0.95rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .search-box {
            width: 100%;
            padding: 12px 18px;
            margin-bottom: 20px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box:focus {
            border-color: #4CAF50;
        }
        .game-card {
            background: #1e1e1e;
            border-radius: 10px;
            padding: 18px 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.2s, border-color 0.2s;
        }
        .game-card:hover {
            border-color: #444;
            transform: translateY(-2px);
        }
        .game-info h3 {
            color: #fff;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
        .game-info p {
            color: #aaa;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }
        .badge {
            display: inline-block;
            background-color: #2a2a2a;
            color: #4CAF50;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #3d3d3d;
        }
        .download-btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .download-btn:hover {
            background-color: #45a049;
        }
        .no-result {
            text-align: center;
            color: #777;
            padding: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>SuperAPK</h1>
            <p>En iyi mobil oyunlar ve APK arşivleri</p>
        </header>

        <input type="text" id="searchInput" class="search-box" placeholder="Oyun ara...">

        <div id="game-list">
            <!-- Oyunlar JavaScript ile buraya eklenecek -->
        </div>
        <div id="noResult" class="no-result">Aradığın oyun bulunamadı :(</div>
    </div>

    <script>
        const games = [
            {
                title: "Stick Empires (Stick War 2 Mobile)",
                version: "V5.3",
                size: "107 MB",
                category: "Strateji",
                filename: "StickEmpires.apk",
                link: "https://drive.google.com/uc?export=download&id=1qgGacDDc5asJuWE9UioU8zxw97shxGnk"
            },
            {
                title: "Age of History II",
                version: "v1.0",
                size: "475 MB",
                category: "Strateji",
                filename: "AgeOfHistory2.apk",
                link: "https://drive.google.com/uc?export=download&id=1N3Fpy1CvZOwcySbIGCUHW8wIHnOAkMmO"
            },
            {
                title: "Minecraft PE Final",
                version: "v1.20+",
                size: "1.14 GB",
                category: "Hayatta Kalma / Sandbox",
                filename: "MinecraftPE.apk",
                link: "https://drive.google.com/uc?export=download&id=1FSeugKWWt7OJQfqHTKxItbuCJkm1-B4R"
            },
            {
                title: "Stardew Valley",
                version: "v1.6.14.0",
                size: "395.7 MB",
                category: "RPG / Simülasyon",
                filename: "StardewValley.apk",
                link: "https://drive.google.com/uc?export=download&id=1tp3OrxSpSVp-HnniXv1JK_fHAzmaxkDx"
            }
        ];

        const gameListContainer = document.getElementById('game-list');
        const searchInput = document.getElementById('searchInput');
        const noResult = document.getElementById('noResult');

        function renderGames(filterText = '') {
            gameListContainer.innerHTML = '';
            const filteredGames = games.filter(game => 
                game.title.toLowerCase().includes(filterText.toLowerCase()) ||
                game.category.toLowerCase().includes(filterText.toLowerCase())
            );

            if (filteredGames.length === 0) {
                noResult.style.display = 'block';
                return;
            } else {
                noResult.style.display = 'none';
            }

            filteredGames.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                
                card.innerHTML = `
                    <div class="game-info">
                        <h3>${game.title}</h3>
                        <p>Sürüm: ${game.version} | Boyut: ${game.size}</p>
                        <span class="badge">${game.category}</span>
                    </div>
                    <a href="${game.link}" class="download-btn" download="${game.filename}">İndir</a>
                `;
                
                gameListContainer.appendChild(card);
            });
        }

        renderGames();

        searchInput.addEventListener('input', (e) => {
            renderGames(e.target.value);
        });
    </script>

</body>
</html>

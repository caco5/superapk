<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperAPK - Mobil Oyun Arşivi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #1f1f1f;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        header h1 {
            color: #4CAF50;
            font-size: 2rem;
            margin-bottom: 5px;
        }
        header p {
            color: #888;
            font-size: 0.95rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .game-card {
            background: #1e1e1e;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .game-info h3 {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }
        .game-info p {
            color: #aaa;
            font-size: 0.85rem;
        }
        .download-btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .download-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>SuperAPK</h1>
            <p>En iyi mobil oyunlar ve APK arşivleri</p>
        </header>

        <div id="game-list">
            <!-- Oyunlar JavaScript ile buraya eklenecek -->
        </div>
    </div>

    <script>
        const games = [
            {
                title: "Stick Empires (Stick War 2 Mobile)",
                version: "V5.3",
                size: "107 MB",
                link: "https://drive.google.com/uc?export=download&id=1qgGacDDc5asJuWE9UioU8zxw97shxGnk"
            }
        ];

        const gameListContainer = document.getElementById('game-list');

        games.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card';
            
            card.innerHTML = `
                <div class="game-info">
                    <h3>${game.title}</h3>
                    <p>Sürüm: ${game.version} | Boyut: ${game.size}</p>
                </div>
                <a href="${game.link}" class="download-btn" target="_blank">İndir</a>
            `;
            
            gameListContainer.appendChild(card);
        });
    </script>

</body>
</html>

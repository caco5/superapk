            align-items: center;
            border: 1px solid #333;

        .game-details {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .game-icon {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            background-color: #2a2a2a;
        }
        .game-info h3 {
            color: #fff;
            font-size: 1.1rem;
            margin-bottom: 4px;
        }
        .game-info p {

            font-size: 0.8rem;

            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;

        .download-btn:hover {

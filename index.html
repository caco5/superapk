<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperAPK - Ücretsiz APK İndir</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-gamepad"></i> Super<span>APK</span>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Oyun ara..." onkeyup="filterGames()">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
    </header>

    <main class="container">
        <h2>Popüler APK Oyunlar</h2>
        
        <!-- Oyunların otomatik yükleneceği alan -->
        <div class="game-grid" id="gameGrid">
            <!-- JavaScript burayı otomatik dolduracak -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 SuperAPK. Tüm hakları saklıdır.</p>
    </footer>

    <!-- Oyunları Otomatik Çeken JavaScript -->
    <script>
        // Yeni oyun eklemek için buraya süslü parantez içinde ekleme yapabilirsin
        const games = [
            {
                name: "Stick Empires",
                version: "v1.0.5",
                size: "85 MB",
                category: "Strateji",
                icon: "https://via.placeholder.com/100",
                link: "#" // Buraya APK indirme linkini (Google Drive vb.) koyacaksın
            },
            {
                name: "Örnek Savaş Oyunu",
                version: "v2.1.0",
                size: "120 MB",
                category: "Aksiyon",
                icon: "https://via.placeholder.com/100",
                link: "#"
            }
        ];

        function displayGames(list) {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = "";

            if(list.length === 0) {
                grid.innerHTML = "<p style='color: #94a3b8; text-align: center;'>Oyun bulunamadı...</p>";
                return;
            }

            list.forEach(game => {
                grid.innerHTML += `
                    <div class="game-card">
                        <img src="${game.icon}" alt="${game.name}">
                        <div class="game-info">
                            <h3>${game.name}</h3>
                            <p>Sürüm: ${game.version} | Boyut: ${game.size}</p>
                            <span class="badge">${game.category}</span>
                        </div>
                        <a href="${game.link}" class="download-btn" target="_blank">
                            <i class="fa-solid fa-download"></i> APK İndir
                        </a>
                    </div>
                `;
            });
        }

        function filterGames() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = games.filter(g => g.name.toLowerCase().includes(query));
            displayGames(filtered);
        }

        // Sayfa açıldığında oyunları listele
        displayGames(games);
    </script>
</body>
</html>

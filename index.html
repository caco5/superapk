<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperAPK</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #2a2a2a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            color: #ffffff;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            margin-bottom: 20px;
            box-sizing: border-box;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--accent-color);
        }

        .game-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .game-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s;
        }

        .game-card:hover {
            border-color: #444;
        }

        .game-info h3 {
            margin: 0 0 6px 0;
            font-size: 18px;
            color: #ffffff;
        }

        .game-meta {
            font-size: 13px;
            color: #888;
        }

        .download-btn {
            background-color: var(--accent-color);
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            transition: background-color 0.2s;
        }

        .download-btn:hover {
            background-color: var(--accent-hover);
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: #666;
            border-top: 1px solid var(--border-color);
            background-color: var(--card-bg);
        }

        .no-result {
            text-align: center;
            color: #777;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <header>
        <h1>SuperAPK</h1>
    </header>

    <div class="container">
        <input type="text" id="searchInput" class="search-box" placeholder="Oyun ara..." onkeyup="filterGames()">
        <div id="gameList" class="game-list">
            <!-- Oyunlar buraya otomatik gelecek -->
        </div>
    </div>

    <footer>
        &copy; 2026 SuperAPK. Tüm hakları saklıdır.
    </footer>

    <script>
        // Oyun listesi bomboş başladı
        const games = [];

        function renderGames(items) {
            const listEl = document.getElementById('gameList');
            if (items.length === 0) {
                listEl.innerHTML = '<div class="no-result">Henüz oyun eklenmedi.</div>';
                return;
            }

            listEl.innerHTML = items.map(game => `
                <div class="game-card">
                    <div class="game-info">
                        <h3>${game.title}</h3>
                        <div class="game-meta">Sürüm: ${game.version} &bull; Boyut: ${game.size}</div>
                    </div>
                    <a href="${game.link}" class="download-btn">APK İndir</a>
                </div>
            `).join('');
        }

        function filterGames() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = games.filter(game => game.title.toLowerCase().includes(query));
            renderGames(filtered);
        }

        // Sayfa açıldığında listeyi yükle
        renderGames(games);
    </script>
</body>
</html>
